version: 2
# Dependabot auto-update config.
#
# Cooldown (7 days) is the point of this config: it delays version-update
# PRs until a newly-published version has aged. Supply-chain attacks like
# the tanstack Shai-Hulud compromise (2026-05-11) live minutes-to-hours
# before the registry yanks them; a 7-day cooldown keeps poisoned
# versions out of our lockfiles.
#
# Every ecosystem uses the same 7 days. Upstream gives Docker a shorter
# 3-day window, but zizmor gates CI on a cooldown of at least 7 days, and
# Docker base images are a supply-chain surface like any other. Docker also
# does not support Dependabot security updates, so a short window buys no
# security response it could not otherwise get.
#
# Security updates bypass cooldown and continue to flow immediately. See:
# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference#cooldown
#
# Auto-merge is deliberately NOT enabled. Every dependabot PR gets human
# review.

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Los_Angeles
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      docker-base-images:
        group-by: dependency-name
        patterns: ["*"]
    ignore:
      # Node 24 remains the active LTS line. Revisit Node 26 after it enters
      # LTS in October 2026: https://github.com/bluesky-social/social-app/issues/11480
      - dependency-name: node
        update-types:
          - version-update:semver-major
