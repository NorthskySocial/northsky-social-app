name: golang

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Git Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Go tooling
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: bskyweb/go.mod
          cache-dependency-path: bskyweb/go.sum
      - name: Dummy Static Files
        # northsky: the Go templates now reference generated Metro font/script includes.
        run: |
          mkdir -p bskyweb/static/_expo bskyweb/static/assets
          touch bskyweb/static/_expo/blah.js bskyweb/static/assets/blah.txt
          touch bskyweb/templates/scripts.html bskyweb/templates/fonts.html
      - name: Check
        run: cd bskyweb/ && make check
      - name: Build (binary)
        run: cd bskyweb/ && make build
      - name: Test
        run: cd bskyweb/ && make test
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Git Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Go tooling
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: bskyweb/go.mod
          cache-dependency-path: bskyweb/go.sum
      - name: Dummy Static Files
        # northsky: the Go templates now reference generated Metro font/script includes.
        run: |
          mkdir -p bskyweb/static/_expo bskyweb/static/assets
          touch bskyweb/static/_expo/blah.js bskyweb/static/assets/blah.txt
          touch bskyweb/templates/scripts.html bskyweb/templates/fonts.html
      - name: Lint
        run: cd bskyweb/ &&  make lint
