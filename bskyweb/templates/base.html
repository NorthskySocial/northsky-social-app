<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, viewport-fit=cover">
  <meta name="referrer" content="origin-when-cross-origin">
  <!--
    Preconnect to essential domains
  -->
  <link rel="preconnect" href="https://bsky.social">
  <link rel="preconnect" href="https://go.bsky.app">
  <title>{%- block head_title -%}{{ appName }}{%- endblock -%}</title>

  <!-- Hello Humans! API docs at https://atproto.com -->

  <!-- northsky: preload Geist body font (webpack-hashed filename) -->
  <link rel="preload" as="font" type="font/woff2" href="{{ staticCDNHost }}/static/media/Geist-Variable.c5aefc5d145b5333adad.woff2" crossorigin>

  <style>
    /**
     * Minimum styles required to render splash.
     *
     * ALL OTHER STYLES BELONG IN `src/style.css`
     *
     * THIS NEEDS TO BE DUPLICATED IN `bskyweb/templates/base.html`
     */
    /* northsky: brand web fonts (Geist body + MuseoModerno display). Webpack-hashed filenames - regenerate both shells after any font-binary change. */
    @font-face {
      font-family: 'Geist';
      src: url("{{ staticCDNHost }}/static/media/Geist-Variable.c5aefc5d145b5333adad.woff2") format('woff2');
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'MuseoModerno';
      src: url("{{ staticCDNHost }}/static/media/MuseoModerno-Variable.e9768c9f95f32d05362b.woff2") format('woff2');
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'MuseoModerno';
      src: url("{{ staticCDNHost }}/static/media/MuseoModerno-Italic-Variable.18a09d17c1aac133031f.woff2") format('woff2');
      font-weight: 100 900;
      font-style: italic;
      font-display: swap;
    }
    html,
    body {
      margin: 0px;
      padding: 0px;
      /* northsky: Geist body font */
      font-family: Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Liberation Sans', Helvetica, Arial, sans-serif;
      text-rendering: optimizeLegibility;
      /* Platform-specific reset */
      -webkit-overflow-scrolling: touch;
      -webkit-text-size-adjust: 100%;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      -ms-overflow-style: scrollbar;
      font-synthesis-weight: none;
    }
    /* northsky: brand theme vars (keep this block identical in web/index.html and bskyweb/templates/base.html) */
    /* --background = contrast_0, --backgroundLight = contrast_100, --text = contrast_1000, --link = primary_500; source: src/brand/palette.ts */
    :root {
      --text: #1F0B35;
      --background: white;
      --backgroundLight: #E1DFF0;
      --link: #9A45EC;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --text: white;
        --background: #1F0B35;
        --backgroundLight: #3A2559;
        --link: #2AFFBA;
      }
    }
    html,
    body,
    #root {
      display: flex;
      flex: 1 0 auto;
      min-height: 100%;
      width: 100%;
    }
    html.theme--light,
    html.theme--light body,
    html.theme--light #root {
      background-color: white;
      --text: #1F0B35;
      --background: white;
      --backgroundLight: #E1DFF0;
      --link: #9A45EC;
    }
    html.theme--dark,
    html.theme--dark body,
    html.theme--dark #root {
      color-scheme: dark;
      background-color: #1F0B35;
      --text: white;
      --background: #1F0B35;
      --backgroundLight: #3A2559;
      --link: #2AFFBA;
    }
    html.theme--dim,
    html.theme--dim body,
    html.theme--dim #root {
      color-scheme: dark;
      background-color: #2B1548;
      --text: white;
      --background: #2B1548;
      --backgroundLight: #4E3B66;
      --link: #4BE6B3;
    }
    #splash {
      display: flex;
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      right: 0;
      align-items: center;
      justify-content: center;
    }
    #splash svg {
      position: relative;
      top: -50px;
      width: 100px;
    }
    /**
     * We need these styles to prevent shifting due to scrollbar show/hide on
     * OSs that have them enabled by default. This also handles cases where the
     * screen wouldn't otherwise scroll, and therefore hide the scrollbar and
     * shift the content, by forcing the page to show a scrollbar.
     */
    body {
      width: 100%;
      overflow-y: scroll;
    }
  </style>
  <script>
    const theme = localStorage.getItem('ALF_THEME')
    if (theme) {
      document.documentElement.classList.add(`theme--${theme}`)
    }
  </script>
  {% if donationConfig %}
  <!-- northsky: donation config for the Support screen -->
  <script>window.__NORTHSKY_DONATIONS__ = {{ donationConfig|safe }}</script>
  {% endif %}

  {% include "scripts.html" %}
  <link rel="apple-touch-icon" sizes="180x180" href="{{ staticCDNHost }}/static/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ staticCDNHost }}/static/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ staticCDNHost }}/static/favicon-16x16.png">
  <!-- northsky: brand accent -->
  <link rel="mask-icon" href="{{ staticCDNHost }}/static/safari-pinned-tab.svg" color="#9A45EC">
  <meta name="theme-color">
  <meta name="application-name" content="{{ appName }}">
  <meta name="generator" content="bskyweb">
  {% if noindex %}<meta name="robots" content="noindex{% if nofollow %}, nofollow{% endif %}">{% endif %}
  <meta property="og:site_name" content="{{ ogSiteName }}">
  <meta property="og:logo" content="{{ favicon }}">
  <meta name="twitter:site" content="{{ twitterHandle }}" />
  <link type="application/activity+json" href="" />

  {% block html_head_extra -%}{%- endblock %}
</head>
<body>
{%- block body_all %}

  </div>
  <div id="root">
  </div>

  <noscript>
    <h1 lang="en">JavaScript Required</h1>
    <p lang="en">This is a heavily interactive web application, and JavaScript is required. Simple HTML interfaces are possible, but that is not what this is.
    <p lang="en">Learn more about Bluesky at <a href="https://bsky.social">bsky.social</a> and <a href="https://atproto.com">atproto.com</a>.
    {% block noscript_extra %}{% endblock %}
  </noscript>
{% endblock -%}
</body>
</html>
